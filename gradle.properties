org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# 主体应用版本。Release 标签用这个版本号，发布主体时更新。
syncClipboard.versionCode=13
syncClipboard.versionName=0.3.0

# 系统扩展版本，与主体各自独立维护，只在扩展自身有改动时才递增。
# 版本名带 -ext 后缀，避免与主体的 Release 标签重名。
syncClipboard.extension.versionCode=13
syncClipboard.extension.versionName=0.3.0-ext
