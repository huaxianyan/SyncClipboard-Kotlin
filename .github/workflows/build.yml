name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Test, lint and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - uses: actions/upload-artifact@v5
        with:
          name: SyncClipboard-Kotlin-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            system-extension/build/outputs/apk/debug/system-extension-debug.apk

  release:
    needs: android
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SYNC_CLIPBOARD_STORE_FILE: ${{ github.workspace }}/syncclipboard-release.jks
      SYNC_CLIPBOARD_STORE_PASSWORD: ${{ secrets.SYNC_CLIPBOARD_STORE_PASSWORD }}
      SYNC_CLIPBOARD_KEY_ALIAS: ${{ secrets.SYNC_CLIPBOARD_KEY_ALIAS }}
      SYNC_CLIPBOARD_KEY_PASSWORD: ${{ secrets.SYNC_CLIPBOARD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v5
      - name: Restore production signing key
        env:
          SYNC_CLIPBOARD_KEYSTORE_BASE64: ${{ secrets.SYNC_CLIPBOARD_KEYSTORE_BASE64 }}
        run: printf '%s' "$SYNC_CLIPBOARD_KEYSTORE_BASE64" | base64 --decode > "$SYNC_CLIPBOARD_STORE_FILE"
      - name: Build signed release APKs
        run: ./gradlew assembleRelease
      - name: Verify release APKs
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          ./scripts/verify-release.sh
      - uses: actions/upload-artifact@v5
        with:
          name: SyncClipboard-Kotlin-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            system-extension/build/outputs/apk/release/system-extension-release.apk
            build/release/SHA256SUMS
      - name: Verify release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/verify_release_notes.py --tag "$GITHUB_REF_NAME"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "Missing release notes: $notes_file" >&2
            exit 1
          fi
          # 正文 = 版本化的发布说明 + 追加的构建信息（版本与两个 APK 的 SHA-256）
          notes_out="build/release/release-notes.md"
          mkdir -p "$(dirname "$notes_out")"
          {
            cat "$notes_file"
            printf '\n## 构建信息\n\n'
            printf '| 项目 | 值 |\n'
            printf '| --- | --- |\n'
            printf '| 版本 | `%s` |\n' "$GITHUB_REF_NAME"
            for apk in \
              app/build/outputs/apk/release/app-release.apk \
              system-extension/build/outputs/apk/release/system-extension-release.apk; do
              printf '| %s SHA-256 | `%s` |\n' "${apk##*/}" "$(sha256sum "$apk" | cut -d' ' -f1)"
            done
          } > "$notes_out"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$notes_out"
            gh release upload "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/app-release.apk \
              system-extension/build/outputs/apk/release/system-extension-release.apk \
              build/release/SHA256SUMS \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              app/build/outputs/apk/release/app-release.apk \
              system-extension/build/outputs/apk/release/system-extension-release.apk \
              build/release/SHA256SUMS \
              --verify-tag \
              --title "SyncClipboard Kotlin $GITHUB_REF_NAME" \
              --notes-file "$notes_out"
          fi
